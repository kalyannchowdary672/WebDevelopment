<!doctype html>
<html lang="en">
  <head>
    <title>Basketball</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">

  </head>
  <body>
    <div class="container">
      <div class="home">
        <h3 id="">HOME</h3>
        <div id="box1">0</div>
        <div class="button">
        <button id="count1" onclick="add1()">+1</button>
        <button onclick="add2()">+2</button>
        <button onclick="add3()">+3</button>
        </div>
      </div>
      <div class="guest">
        <h3 id="">GUEST</h3>
        <div id="box2">0</div>
        <div class="button">
        <button onclick="increment1()">+1</button>
        <button onclick="increment2()">+2</button>
        <button onclick="increment3()">+3</button>
      </div>
      </div>
    </div>
     <button id="newgame" onclick="reset()">NEW GAME</button>
    <script src="script.js"></script>
  </body>
</html>
